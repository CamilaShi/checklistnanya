<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histórico — Checklist Oficina Nanya</title>
  <link rel="icon" type="image/png" href="assets/logo-nanya.png" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="app">
    <aside class="menu-lateral">
      <div class="marca-menu">NANYA</div>
      <nav>
        <a href="home.html">Criar Check List</a>
        <a href="acompanhamento.html">Status</a>
        <a href="visualizar-checklist.html">Visualizar</a>
        <a href="cadastros.html">Cadastro</a>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Dashboard</button>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Relatórios</button>
        <a href="historico.html" class="ativo">Histórico</a>
        <a href="configuracoes.html" id="menu-configuracoes">Configurações</a>
      </nav>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <h1>Histórico</h1>
        <div class="acoes-topo">
          <div class="usuario-logado">
            <div><strong id="nome-usuario"></strong> · <span id="perfil-usuario"></span></div>
          </div>
          <button type="button" class="botao-primario botao-topo botao-secundario-topo" onclick="abrirModalSenha()">Alterar senha</button>
          <button type="button" class="botao-primario botao-topo" onclick="sair()">Sair</button>
        </div>
      </header>

      <main class="corpo">
        <!-- ---------- RESUMO GERAL DA NANYA ---------- -->
        <div class="bloco">
          <h2>Histórico geral da Nanya</h2>
          <div class="cartoes-resumo-historico" id="cartoes-resumo-historico">
            <div class="cartao-resumo-historico">
              <div class="numero-resumo-historico" id="resumo-total-clientes">—</div>
              <div class="rotulo-resumo-historico">Clientes atendidos</div>
            </div>
            <div class="cartao-resumo-historico">
              <div class="numero-resumo-historico" id="resumo-total-veiculos">—</div>
              <div class="rotulo-resumo-historico">Veículos atendidos</div>
            </div>
            <div class="cartao-resumo-historico">
              <div class="numero-resumo-historico" id="resumo-total-atendimentos">—</div>
              <div class="rotulo-resumo-historico">Check Lists realizados</div>
            </div>
          </div>
          <button type="button" class="botao-secundario" id="botao-pdf-geral" style="margin-top: 10px;">Exportar PDF do resumo geral</button>
          <div class="mensagem-inline" id="mensagem-pdf-geral"></div>
        </div>

        <!-- ---------- BUSCA POR VEÍCULO OU CLIENTE ---------- -->
        <div class="bloco">
          <h2>Histórico por veículo ou por cliente</h2>
          <fieldset class="grupo-cadastro">
            <legend>Buscar</legend>
            <div class="linha-campos">
              <div class="campo w-busca-placa">
                <label for="historico-placa">Placa</label>
                <input type="text" id="historico-placa" placeholder="Ex: ABC1D23" />
              </div>
              <button type="button" class="botao-secundario" id="botao-buscar-historico-placa" style="align-self: flex-end;">Buscar por placa</button>
              <div class="campo w-busca-nome">
                <label for="historico-cliente">Cliente já cadastrado</label>
                <select id="historico-cliente">
                  <option value="">Selecione...</option>
                </select>
              </div>
              <button type="button" class="botao-secundario" id="botao-buscar-historico-cliente" style="align-self: flex-end;">Buscar por cliente</button>
            </div>
            <div class="mensagem-inline" id="mensagem-busca-historico"></div>
          </fieldset>
        </div>

        <!-- ---------- RESULTADO ---------- -->
        <div class="bloco oculto" id="secao-resultado-historico">
          <h2 id="titulo-resultado-historico">Resultado</h2>
          <div id="resumo-resultado-historico" class="aviso"></div>
          <div id="lista-resultado-historico"></div>
          <button type="button" class="botao-secundario" id="botao-pdf-resultado" style="margin-top: 10px;">Exportar PDF deste resultado</button>
          <div class="mensagem-inline" id="mensagem-pdf-resultado"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
