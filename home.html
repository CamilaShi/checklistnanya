<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Início — Checklist Oficina Nanya</title>
  <link rel="icon" type="image/png" href="assets/logo-nanya.png" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="app">
    <aside class="menu-lateral">
      <div class="marca-menu">NANYA</div>
      <nav>
        <a href="home.html" class="ativo">Novo Check List</a>
        <a href="acompanhamento.html">Acompanhamento</a>
        <a href="visualizar-checklist.html">Check List</a>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Dashboard</button>
        <a href="cadastros.html">Cadastros</a>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Relatórios</button>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Histórico</button>
        <button class="item-menu" id="menu-configuracoes" onclick="itemEmConstrucao(event)">Configurações</button>
      </nav>
      <div class="rodape-menu">
        <button class="item-menu" onclick="sair()" style="color: #ffb3b3;">Sair</button>
      </div>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <h1>Novo Check List</h1>
        <div class="usuario-logado">
          <div><strong id="nome-usuario"></strong> · <span id="perfil-usuario"></span></div>
        </div>
      </header>

      <main class="corpo">
        <div class="bloco">
          <h2>Selecione o tipo de Check List</h2>
          <div id="area-modelos">
            <p class="aviso">Carregando modelos...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
