<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Checklist Oficina Nanya</title>
  <link rel="icon" type="image/png" href="assets/logo-nanya.png" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="app">
    <aside class="menu-lateral">
      <div class="marca-menu">NANYA</div>
      <nav>
        <a href="home.html">Criar Check List</a>
        <a href="acompanhamento.html">Status</a>
        <a href="visualizar-checklist.html">Visualizar</a>
        <a href="cadastros.html">Cadastro</a>
        <a href="dashboard.html" class="ativo">Dashboard</a>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Relatórios</button>
        <a href="historico.html">Histórico</a>
        <a href="configuracoes.html" id="menu-configuracoes">Configurações</a>
      </nav>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <h1>Dashboard</h1>
        <div class="acoes-topo">
          <div class="usuario-logado">
            <div><strong id="nome-usuario"></strong> · <span id="perfil-usuario"></span></div>
          </div>
          <button type="button" class="botao-primario botao-topo botao-secundario-topo" onclick="abrirModalSenha()">Alterar senha</button>
          <button type="button" class="botao-primario botao-topo" onclick="sair()">Sair</button>
        </div>
      </header>

      <main class="corpo">
        <div class="bloco dash-filtros">
          <div class="linha-campos">
            <div class="campo w-data">
              <label for="dash-data-inicial">De</label>
              <input type="date" id="dash-data-inicial" />
            </div>
            <div class="campo w-data">
              <label for="dash-data-final">Até</label>
              <input type="date" id="dash-data-final" />
            </div>
            <div class="campo w-medio">
              <label for="dash-status">Status</label>
              <select id="dash-status">
                <option value="">Todos</option>
                <option value="Aberto">Aberto</option>
                <option value="Aguardando Aprovacao">Aguardando Aprovação</option>
                <option value="Aprovado">Aprovado</option>
                <option value="Em Execucao">Em Execução</option>
                <option value="Finalizado">Finalizado</option>
              </select>
            </div>
            <div class="campo w-medio">
              <label for="dash-atendente">Atendente</label>
              <select id="dash-atendente"><option value="">Todos</option></select>
            </div>
            <div class="campo w-busca-cliente">
              <label for="dash-cliente">Cliente</label>
              <select id="dash-cliente"><option value="">Todos</option></select>
            </div>
            <div class="campo w-medio">
              <label for="dash-placa">Placa</label>
              <select id="dash-placa"><option value="">Todas</option></select>
            </div>
            <div class="campo w-medio">
              <label for="dash-marca">Marca</label>
              <select id="dash-marca"><option value="">Todas</option></select>
            </div>
            <button type="button" class="botao-secundario botao-lupa" id="dash-buscar" title="Buscar" aria-label="Buscar"><svg class="icone-lupa" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="15" y1="15" x2="21" y2="21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
            <button type="button" class="botao-secundario" id="dash-limpar">Limpar</button>
          </div>
          <div class="dash-atalhos">
            <button type="button" class="dash-atalho" data-atalho="hoje">Hoje</button>
            <button type="button" class="dash-atalho" data-atalho="mes">Este mês</button>
            <button type="button" class="dash-atalho" data-atalho="mes-passado">Mês passado</button>
            <button type="button" class="dash-atalho" data-atalho="ano">Este ano</button>
            <button type="button" class="dash-atalho" data-atalho="ano-passado">Ano passado</button>
          </div>
          <div class="mensagem-inline" id="dash-mensagem"></div>
        </div>

        <div id="dash-conteudo" class="oculto">
          <div class="dash-kpis" id="dash-kpis"></div>
          <div class="dash-grade" id="dash-grade"></div>
          <div class="dash-nota" id="dash-nota"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
