<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check List — Checklist Oficina Nanya</title>
  <link rel="icon" type="image/png" href="assets/logo-nanya.png" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="app">
    <aside class="menu-lateral">
      <div class="marca-menu">NANYA</div>
      <nav>
        <a href="home.html">Criar Check List</a>
        <a href="acompanhamento.html">Status</a>
        <a href="visualizar-checklist.html">Visualizar</a>
        <a href="cadastros.html">Cadastro</a>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Dashboard</button>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Relatórios</button>
        <button class="item-menu" onclick="itemEmConstrucao(event)">Histórico</button>
        <a href="configuracoes.html" id="menu-configuracoes">Configurações</a>
      </nav>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <h1>Check List — Vistoria (Parte 1)</h1>
        <div class="acoes-topo">
          <div class="usuario-logado">
            <div><strong id="nome-usuario"></strong> · <span id="perfil-usuario"></span></div>
          </div>
          <button type="button" class="botao-primario botao-topo botao-secundario-topo" onclick="abrirModalSenha()">Alterar senha</button>
          <button type="button" class="botao-primario botao-topo" onclick="sair()">Sair</button>
        </div>
      </header>

      <main class="corpo">
        <form id="form-checklist">
          <!-- ---------- IDENTIFICAR ATENDIMENTO (cabeçalho compacto, tipo papel) ---------- -->
          <fieldset class="grupo-cadastro">
            <legend>Cliente / Veículo</legend>

            <div class="linha-campos">
              <div class="campo w-data"><label for="campo-data">Data</label><input type="text" id="campo-data" readonly /></div>
              <div class="campo w-hora"><label for="campo-hora">Hora</label><input type="text" id="campo-hora" readonly /></div>
              <div class="campo w-atendente"><label for="campo-atendente">Vendedor</label><input type="text" id="campo-atendente" readonly /></div>
              <div class="campo w-os"><label for="campo-os">OS</label><input type="text" id="campo-os" readonly placeholder="gerada ao salvar" /></div>
            </div>

            <div class="faixa-tipo-pessoa">
              <label><input type="radio" name="tipo-pessoa" value="PF" checked /> Pessoa Física</label>
              <label><input type="radio" name="tipo-pessoa" value="PJ" /> Pessoa Jurídica</label>
            </div>

            <div class="linha-campos">
              <div class="grupo-busca-inline" id="busca-pf">
                <div class="campo w-codigo">
                  <label for="cpf">CPF</label>
                  <input type="text" id="cpf" placeholder="000.000.000-00" />
                </div>
                <button type="button" class="botao-lupa" id="botao-buscar-cpf" title="Buscar no cadastro (grátis)">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button type="button" class="botao-secundario oculto" id="botao-buscar-cpf-api">Buscar na API (R$0,12)</button>
              </div>

              <div class="grupo-busca-inline oculto" id="busca-pj">
                <div class="campo w-codigo">
                  <label for="cnpj">CNPJ</label>
                  <input type="text" id="cnpj" placeholder="00.000.000/0000-00" />
                </div>
                <button type="button" class="botao-lupa" id="botao-buscar-cnpj" title="Buscar no cadastro (grátis)">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button type="button" class="botao-secundario oculto" id="botao-buscar-cnpj-api">Buscar na API (R$0,04)</button>
              </div>

              <div class="campo w-telefone">
                <label for="telefone">Celular</label>
                <input type="text" id="telefone" placeholder="(34) 90000-0000" />
              </div>
              <div class="campo w-email">
                <label for="email-cliente">Email</label>
                <input type="email" id="email-cliente" />
              </div>
            </div>

            <div class="mensagem-inline" id="mensagem-cliente"></div>

            <div class="linha-campos">
              <div class="campo w-data-nascimento">
                <label for="data-nascimento">Data Nascimento</label>
                <input type="text" id="data-nascimento" readonly />
              </div>
              <div class="campo w-nome-linha">
                <label for="nome" id="rotulo-nome">Nome</label>
                <input type="text" id="nome" />
              </div>
            </div>

            <div class="linha-campos">
              <div class="campo w-cheio">
                <label for="endereco-resumo">Endereço</label>
                <input type="text" id="endereco-resumo" readonly placeholder="Preencha em '+ Mostrar mais campos'" />
              </div>
            </div>

            <div class="campo w-cheio oculto" id="campo-veiculos-cliente">
              <label for="select-veiculos-cliente">Veículos já cadastrados deste cliente</label>
              <select id="select-veiculos-cliente">
                <option value="">+ Veículo novo</option>
              </select>
            </div>

            <div class="linha-campos">
              <div class="grupo-busca-inline">
                <div class="campo w-codigo-curto">
                  <label for="placa">Placa</label>
                  <input type="text" id="placa" placeholder="ABC1D23" />
                </div>
                <button type="button" class="botao-lupa" id="botao-buscar-placa" title="Buscar no cadastro (grátis)">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <button type="button" class="botao-secundario oculto" id="botao-buscar-placa-api">Buscar na API (R$0,08)</button>
              </div>
              <div class="campo w-km">
                <label for="km">Km atual</label>
                <input type="text" id="km" placeholder="Ex: 35000" />
              </div>
            </div>

            <div class="mensagem-inline" id="mensagem-veiculo"></div>

            <div class="linha-campos">
              <div class="campo w-medio"><label for="marca">Marca</label><input type="text" id="marca" readonly /></div>
              <div class="campo w-modelo"><label for="modelo">Modelo</label><input type="text" id="modelo" readonly /></div>
              <div class="campo w-estreito"><label for="ano-modelo">Ano</label><input type="text" id="ano-modelo" readonly /></div>
              <div class="campo w-combustivel"><label for="combustivel">Combustível</label><input type="text" id="combustivel" readonly /></div>
            </div>

            <div class="linha-campos">
              <div class="campo w-cheio">
                <label>Nível do Combustível</label>
                <div class="faixa-nivel-combustivel">
                  <label><input type="radio" name="nivel-combustivel" value="0" /> 0</label>
                  <label><input type="radio" name="nivel-combustivel" value="1/4" /> 1/4</label>
                  <label><input type="radio" name="nivel-combustivel" value="1/2" /> 1/2</label>
                  <label><input type="radio" name="nivel-combustivel" value="3/4" /> 3/4</label>
                  <label><input type="radio" name="nivel-combustivel" value="1" /> 1</label>
                </div>
              </div>
            </div>

            <div class="linha-campos">
              <div class="faixa-presenca">
                <label><input type="radio" name="cliente-presente" value="Sim" checked /> Cliente presente</label>
                <label><input type="radio" name="cliente-presente" value="Não" /> Cliente ausente</label>
              </div>
            </div>
          </fieldset>

          <div class="linha-campos">
            <button type="button" class="botao-secundario" id="botao-mais-campos">+ Mostrar mais campos (endereço, dados técnicos do veículo...)</button>
          </div>

          <div class="oculto" id="secao-mais-campos">
            <!-- ---------- CLIENTE — DADOS COMPLETOS ---------- -->
            <fieldset class="grupo-cadastro">
              <legend>Cliente — dados completos</legend>
              <div class="linha-campos">
                <div class="campo w-sexo" id="campo-sexo">
                  <label for="sexo">Sexo</label>
                  <select id="sexo">
                    <option value="">Selecione</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                  </select>
                </div>
                <div class="campo w-estreito" id="campo-idade">
                  <label for="idade">Idade</label>
                  <input type="text" id="idade" readonly />
                </div>
                <div class="campo w-largo" id="campo-nome-mae">
                  <label for="nome-mae">Nome mãe</label>
                  <input type="text" id="nome-mae" readonly />
                </div>

                <div class="campo w-largo oculto" id="campo-nome-fantasia">
                  <label for="nome-fantasia">Nome fantasia</label>
                  <input type="text" id="nome-fantasia" readonly />
                </div>
                <div class="campo w-medio oculto" id="campo-regime">
                  <label for="regime-tributario">Regime</label>
                  <input type="text" id="regime-tributario" readonly />
                </div>
                <div class="campo w-estreito oculto" id="campo-situacao">
                  <label for="situacao-cadastral">Situação</label>
                  <input type="text" id="situacao-cadastral" readonly />
                </div>
                <div class="campo w-medio oculto" id="campo-inicio-atividades">
                  <label for="inicio-atividades">Início atividades</label>
                  <input type="text" id="inicio-atividades" readonly />
                </div>
              </div>
            </fieldset>

            <!-- ---------- ENDEREÇO ---------- -->
            <fieldset class="grupo-cadastro">
              <legend>Endereço</legend>

              <div class="linha-campos">
                <div class="grupo-busca-inline">
                  <div class="campo w-cep">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" />
                  </div>
                  <button type="button" class="botao-lupa" id="botao-buscar-cep" title="Buscar CEP (grátis)">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </button>
                </div>
                <div class="campo w-numero">
                  <label for="numero">Número</label>
                  <input type="text" id="numero" placeholder="Ex: 123" />
                </div>
                <div class="campo w-largo">
                  <label for="complemento">Complemento</label>
                  <input type="text" id="complemento" />
                </div>
              </div>

              <div class="mensagem-inline" id="mensagem-endereco"></div>

              <div class="linha-campos">
                <div class="campo w-rua">
                  <label for="rua">Rua</label>
                  <input type="text" id="rua" readonly />
                </div>
                <div class="campo w-bairro">
                  <label for="bairro">Bairro</label>
                  <input type="text" id="bairro" readonly />
                </div>
                <div class="campo w-medio">
                  <label for="cidade">Cidade</label>
                  <input type="text" id="cidade" readonly />
                </div>
                <div class="campo w-estreito">
                  <label for="uf">UF</label>
                  <input type="text" id="uf" readonly />
                </div>
                <input type="hidden" id="codigo-ibge" />
              </div>
            </fieldset>

            <!-- ---------- VEÍCULO — DADOS TÉCNICOS ---------- -->
            <fieldset class="grupo-cadastro">
              <legend>Veículo — dados técnicos</legend>
              <div class="linha-campos">
                <div class="campo w-medio"><label for="fabricante">Fabricante</label><input type="text" id="fabricante" readonly /></div>
                <div class="campo w-largo"><label for="versao">Versão</label><input type="text" id="versao" readonly /></div>
                <div class="campo w-estreito"><label for="ano-fabricacao">Ano fab.</label><input type="text" id="ano-fabricacao" readonly /></div>
                <div class="campo w-cor"><label for="cor">Cor</label><input type="text" id="cor" readonly /></div>
                <div class="campo w-nacionalidade"><label for="nacionalidade">Nacionalidade</label><input type="text" id="nacionalidade" readonly /></div>
                <div class="campo w-estreito"><label for="tipo-veiculo">Tipo</label><input type="text" id="tipo-veiculo" readonly /></div>
                <div class="campo w-chassi"><label for="chassi">Chassi</label><input type="text" id="chassi" readonly /></div>
                <div class="campo w-largo"><label for="numero-motor">Nº motor</label><input type="text" id="numero-motor" readonly /></div>
                <div class="campo w-estreito"><label for="potencia">Potência</label><input type="text" id="potencia" readonly /></div>
                <div class="campo w-cilindradas"><label for="cilindradas">Cilindradas</label><input type="text" id="cilindradas" readonly /></div>
                <div class="campo w-medio"><label for="motor-descricao">Motor</label><input type="text" id="motor-descricao" readonly /></div>
                <div class="campo w-medio"><label for="transmissao">Transmissão</label><input type="text" id="transmissao" readonly /></div>
                <div class="campo w-estreito"><label for="uf-emplacamento">UF emplac.</label><input type="text" id="uf-emplacamento" readonly /></div>
                <div class="campo w-medio"><label for="cidade-emplacamento">Cidade empl.</label><input type="text" id="cidade-emplacamento" readonly /></div>
              </div>
            </fieldset>
          </div>

          <!-- ---------- SOLICITAÇÕES DO CLIENTE ---------- -->
          <fieldset class="grupo-cadastro">
            <legend>Solicitações do Cliente</legend>
            <div id="lista-solicitacoes"></div>
            <button type="button" class="botao-secundario" id="botao-add-solicitacao">+ Adicionar solicitação</button>
          </fieldset>

          <!-- ---------- ACESSÓRIOS ---------- -->
          <fieldset class="grupo-cadastro">
            <legend>Acessórios</legend>
            <div class="lista-checklist" id="lista-acessorios">
              <p class="aviso">Carregando itens...</p>
            </div>
            <div class="campo w-cheio">
              <label for="observacao-acessorios">Observação geral (Acessórios)</label>
              <input type="text" id="observacao-acessorios" placeholder="Observação opcional sobre os acessórios" />
            </div>
            <div class="linha-item-novo oculto" id="novo-item-acessorio">
              <input type="text" id="nome-novo-acessorio" placeholder="Nome do acessório novo" />
              <button type="button" id="botao-add-acessorio">+ Adicionar item</button>
            </div>
          </fieldset>

          <!-- ---------- ITENS TÉCNICOS ---------- -->
          <fieldset class="grupo-cadastro">
            <legend>Itens Técnicos</legend>
            <div class="lista-checklist" id="lista-tecnicos">
              <p class="aviso">Carregando itens...</p>
            </div>
            <div class="campo w-cheio">
              <label for="observacao-tecnicos">Observação geral (Itens Técnicos)</label>
              <input type="text" id="observacao-tecnicos" placeholder="Observação opcional sobre os itens técnicos" />
            </div>
            <div class="linha-item-novo oculto" id="novo-item-tecnico">
              <input type="text" id="nome-novo-tecnico" placeholder="Nome do item técnico novo" />
              <button type="button" id="botao-add-tecnico">+ Adicionar item</button>
            </div>
          </fieldset>

          <!-- ---------- FOTOS ---------- -->
          <fieldset class="grupo-cadastro">
            <legend>Fotos do veículo</legend>
            <input type="file" id="input-fotos" accept="image/*" multiple capture="environment" />
            <div class="area-fotos" id="area-fotos"></div>
          </fieldset>

          <div class="caixa-salvar">
            <div class="mensagem-inline" id="mensagem-salvar"></div>
            <div class="barra-acoes">
              <button type="submit" class="botao-primario" id="botao-salvar">Salvar Check List</button>
            </div>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
