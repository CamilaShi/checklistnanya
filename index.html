<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checklist Oficina Nanya</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <div class="pagina-login">
    <div class="cartao-login">
      <div class="marca">
        <img src="assets/logo-nanya.png" alt="Nanya" class="logo-marca" />
        <div class="subtitulo">Checklist Oficina</div>
      </div>

      <form id="form-login">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nome@nanya.com.br" required />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required />
        </div>
        <button type="submit" class="botao-primario" id="botao-entrar">Entrar</button>
        <div class="mensagem-erro" id="erro"></div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
